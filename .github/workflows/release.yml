name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: npm run build:all
          - os: windows-latest
            build: npm run tauri build -- --bundles nsis

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm flatpak flatpak-builder
          flatpak remote-add --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.build }}

      - name: Rename
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -f veil.flatpak ]; then
            mv veil.flatpak "veil-$v-x86_64.flatpak"
          fi
          if [ -f src-tauri/target/release/veil.exe ]; then
            cp src-tauri/target/release/veil.exe "src-tauri/target/release/bundle/nsis/veil-$v-x64.exe"
          fi
          cd src-tauri/target
          while IFS= read -r f; do
            d="${f%/*}"
            case "$f" in
              *.deb) mv "$f" "$d/veil-$v-amd64.deb" ;;
              *.rpm) mv "$f" "$d/veil-$v-x86_64.rpm" ;;
              *.AppImage) mv "$f" "$d/veil-$v-x86_64.AppImage" ;;
              *setup.exe) mv "$f" "$d/veil-$v-x64-setup.exe" ;;
            esac
          done < <(find . -path '*/bundle/*/*' -type f)

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            *.flatpak
            src-tauri/target/**/bundle/nsis/*.exe
          draft: true
          generate_release_notes: true
