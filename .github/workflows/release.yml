name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run tauri build -- --bundles deb,appimage
          flatpak-builder --user --install-deps-from=flathub --force-clean build-dir com.vzpyr.veil.yml --repo=repo
          flatpak build-bundle repo veil.flatpak com.vzpyr.veil

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run tauri build -- --bundles nsis

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            *.flatpak
            src-tauri/target/release/bundle/nsis/*.exe
          draft: true
          generate_release_notes: true
